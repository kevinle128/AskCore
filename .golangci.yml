version: "2"
linters:
  default: standard
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    paths:
      # Protobuf bindings. The current files have no "Code generated" header, so
      # the default generated-file filter does not skip them. Regenerate with buf.
      - proto/.*\.pb\.go$
  settings:
    # Import rules from docs/ask-architecture-reference.md section 8.
    # A deny entry is a package path prefix.
    depguard:
      rules:
        askui-public-boundary:
          list-mode: strict
          files:
            - "**/pkg/askui/**"
          allow:
            - $gostd
            - AskCore/pkg/protocol
        tui-client-boundary:
          list-mode: lax
          files:
            - "**/internal/tui/**"
          deny:
            - pkg: AskCore/internal/agent
              desc: terminal components receive client dependencies through constructors
            - pkg: AskCore/internal/acp
              desc: terminal components receive client dependencies through constructors
            - pkg: AskCore/internal/leader
              desc: terminal components receive client dependencies through constructors
            - pkg: AskCore/internal/providers
              desc: terminal components receive client dependencies through constructors
            - pkg: AskCore/internal/tools
              desc: terminal components receive client dependencies through constructors
            - pkg: AskCore/internal/store
              desc: terminal components receive client dependencies through constructors
            - pkg: AskCore/internal/config
              desc: terminal components receive client dependencies through constructors
        tuiext-host-boundary:
          list-mode: strict
          files:
            - "**/internal/tuiext/**"
          allow:
            - $gostd
            - AskCore/pkg/protocol
            - AskCore/pkg/askui
            - AskCore/internal/settings
            - AskCore/internal/workspace
        core-no-terminal-ui:
          list-mode: lax
          files:
            - "**/internal/agent/**"
            - "**/internal/pipeline/**"
            - "**/internal/tools/**"
            - "**/internal/providers/**"
            - "**/internal/store/**"
            - "**/internal/sessions/**"
            - "**/internal/hooks/**"
            - "**/internal/bus/**"
          deny:
            - pkg: AskCore/internal/tui
              desc: core packages must not depend on terminal components or UI extension hosts
        settings-stdlib-only:
          list-mode: strict
          files:
            - "**/internal/settings/**"
          allow:
            - $gostd
        providers-no-auth-store:
          list-mode: lax
          files:
            - "**/internal/providers/**"
          deny:
            - pkg: AskCore/internal/settings
              desc: providers receive resolved auth values, not persisted credentials
            - pkg: AskCore/internal/auth
              desc: providers receive resolved auth values, not auth services
        core-no-agent:
          list-mode: lax
          files:
            - "**/internal/tools/**"
            - "**/internal/pipeline/**"
            - "**/internal/providers/**"
            - "**/internal/store/**"
            - "**/internal/sessions/**"
          deny:
            - pkg: AskCore/internal/agent
              desc: core packages must not import the agent package; agent adapts itself into their dependencies
        core-no-transport:
          list-mode: lax
          files:
            - "**/internal/agent/**"
            - "**/internal/pipeline/**"
            - "**/internal/tools/**"
            - "**/internal/providers/**"
            - "**/internal/store/**"
          deny:
            - pkg: AskCore/internal/gateway
              desc: core packages must not import transport
            - pkg: AskCore/internal/http
              desc: core packages must not import transport
            - pkg: AskCore/internal/channels/
              desc: core packages must not import a chat platform package
        core-no-adapters:
          list-mode: lax
          files:
            - "**/internal/agent/**"
            - "**/internal/pipeline/**"
            - "**/internal/tools/**"
            - "**/internal/providers/**"
            - "**/internal/store/**"
            - "**/internal/sessions/**"
            - "**/internal/hooks/**"
            - "**/internal/bus/**"
          deny:
            - pkg: AskCore/internal/acp
              desc: the ACP adapter wraps the agent; core packages must not import it
            - pkg: AskCore/internal/leader
              desc: the leader routes bytes to the agent; core packages must not import it
        leader-router-boundary:
          list-mode: strict
          files:
            - "**/internal/leader/**"
          allow:
            - $gostd
            - AskCore/pkg/protocol
            - AskCore/internal/logs
            - golang.org/x/sys/unix
            - go.uber.org/zap
            # Test helpers only. Production code has no use for them.
            - github.com/stretchr/testify
            - go.uber.org/goleak
        providers-no-tools:
          list-mode: lax
          files:
            - "**/internal/providers/**"
          deny:
            - pkg: AskCore/internal/tools
              desc: tools may import providers, not the reverse
        providers-no-fantasy:
          list-mode: lax
          files:
            - "**/internal/providers/**"
            - "!**/internal/providers/anthropic/**"
            - "!**/internal/providers/fantasykit/**"
            - "!**/internal/providers/openai/**"
          deny:
            - pkg: charm.land/fantasy
              desc: only internal/providers/anthropic, fantasykit, and openai may import fantasy
        providers-no-anthropic-sdk:
          list-mode: lax
          files:
            - "**/internal/providers/**"
            - "!**/internal/providers/anthropic/**"
          deny:
            - pkg: github.com/anthropics/anthropic-sdk-go
              desc: only internal/providers/anthropic may import the Anthropic SDK
        providers-no-openai-sdk:
          list-mode: lax
          files:
            - "**/internal/providers/**"
            - "!**/internal/providers/openai/**"
          deny:
            - pkg: github.com/charmbracelet/openai-go
              desc: only internal/providers/openai may import openai-go
        store-no-implementation:
          list-mode: lax
          files:
            - "**/internal/store/*.go"
          deny:
            - pkg: AskCore/internal/store/gormstore
              desc: store interfaces must not depend on their implementation
        handlers-no-db:
          list-mode: lax
          files:
            - "**/internal/http/**"
            - "**/internal/gateway/**"
          deny:
            - pkg: AskCore/internal/store/gormstore
              desc: handlers call store interfaces only
            - pkg: gorm.io
              desc: handlers call store interfaces only
            - pkg: database/sql
              desc: handlers call store interfaces only
        gormstore-only-in-root:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/app/**"
            - "!**/cmd/server/**"
            - "!**/internal/store/gormstore/**"
          deny:
            - pkg: AskCore/internal/store/gormstore
              desc: only internal/app and cmd/server import the store implementation
        config-only-in-root:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/app/**"
            - "!**/cmd/**"
            - "!**/internal/config/**"
          deny:
            - pkg: AskCore/internal/config
              desc: receive typed config through the constructor; only internal/app and cmd read config
formatters:
  enable:
    - gofmt
    - goimports
