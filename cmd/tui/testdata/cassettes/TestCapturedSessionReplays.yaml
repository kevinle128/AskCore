        body: '{"include":["reasoning.encrypted_content"],"input":[{"content":"You are Ask, a coding agent harness. You help the user read, change and run code in their project. Use the tools to look at the project before you answer, and to make changes. Be concise.\n\nAvailable tools:\n- bash: Execute bash commands (ls, grep, find, etc.)\n- edit: Make precise file edits with exact text replacement, including multiple disjoint edits in one call\n- find: Find files by glob pattern (respects .gitignore)\n- grep: Search file contents for patterns (respects .gitignore)\n- job_kill: Stop a background job\n- job_list: List the background jobs of this session\n- job_output: Read the output and status of a background job\n- ls: List directory contents\n- monitor: Watch a long-running command: each of its stdout lines arrives as a notice\n- read: Read file contents\n- write: Create or overwrite files\n\nGuidelines:\n- Use run_in_background for servers and long builds. A notice arrives when the job ends or goes silent, so do not poll job_output.\n- Use edit for precise changes (edits[].oldText must match exactly)\n- When changing multiple separate locations in one file, use one edit call with multiple entries in edits[] instead of multiple edit calls\n- Each edits[].oldText is matched against the original file, not after earlier edits are applied. Do not emit overlapping or nested edits. Merge nearby changes into one edit.\n- Keep edits[].oldText as small as possible while still being unique in the file. Do not pad with large unchanged regions.\n- Use read to examine files instead of cat or sed.\n- Use write only for new files or complete rewrites.\n\nAsk documentation: docs/cli.md describes the command line and docs/README.md lists the other docs. Read them only when the user asks about Ask itself.","role":"developer"},{"content":[{"text":"Use the echo tool with the text captured, then reply with only the word ok.","type":"input_text"}],"role":"user"}],"model":"gpt-5.5","prompt_cache_key":"00000000-0000-4000-8000-000000000001","store":false,"stream":true,"tools":[{"strict":false,"parameters":{"properties":{"command":{"description":"Bash command to execute","type":"string"},"run_in_background":{"description":"Start the command as a background job and return at once","type":"boolean"},"timeout":{"description":"Seconds to wait before the command moves to the background (default 120, maximum 600). With run_in_background, the seconds the job may run in the background (default 7200, or 600 in a non-interactive run; maximum 7200)","type":"number"}},"required":["command"],"type":"object"},"name":"bash","description":"Execute a bash command in the current working directory and return its stdout and stderr. The command runs without a terminal and with a non-interactive environment: no pager, no prompt, no color. A result starts with the exit code. If the output is longer than 2000 lines or 50KB, the middle is left out and the full output is saved to a file that the result names. The command is a job. It runs in the foreground for at most `timeout` seconds (default 120, maximum 600). A command that runs longer moves to the background and goes on as a job; it is not stopped. Set run_in_background to true to start a long command, such as a server or a build, in the background at once. A notice arrives when a background job finishes, so do not poll job_output. Stop a job with job_kill. Do not end the command with &. Background jobs end when the session closes. A background job stops after a time limit (by default 2 hours; 10 minutes in a non-interactive run, which waits for its background jobs); with run_in_background, `timeout` sets that limit, up to 2 hours. When a background job prints no output for 5 minutes, a notice says so; the job still runs.","type":"function"},{"strict":false,"parameters":{"properties":{"text":{"description":"The text to return.","type":"string"}},"required":["text"],"type":"object"},"name":"echo","description":"Return the given text unchanged.","type":"function"},{"strict":false,"parameters":{"properties":{"edits":{"description":"One or more targeted replacements. Each edit is matched against the original file, not incrementally. Do not include overlapping or nested edits. If two changes touch the same block or nearby lines, merge them into one edit instead.","items":{"properties":{"newText":{"description":"Replacement text for this targeted edit.","type":"string"},"oldText":{"description":"Exact text for one targeted replacement. It must be unique in the original file and must not overlap with any other edits[].oldText in the same call.","type":"string"}},"required":["oldText","newText"],"type":"object"},"type":"array"},"path":{"description":"Path to the file to edit (relative or absolute)","type":"string"}},"required":["path","edits"],"type":"object"},"name":"edit","description":"Edit a single file using exact text replacement. Every edits[].oldText must match a unique, non-overlapping region of the original file. If two changes affect the same block or nearby lines, merge them into one edit instead of emitting overlapping edits. Do not include large unchanged regions just to connect distant changes.","type":"function"},{"strict":false,"parameters":{"properties":{"limit":{"description":"Maximum number of results (default: 1000)","type":"number"},"path":{"description":"Directory to search in (default: current directory)","type":"string"},"pattern":{"description":"Glob pattern to match files, e.g. ''*.ts'', ''**/*.json'', or ''src/**/*.spec.ts''","type":"string"}},"required":["pattern"],"type":"object"},"name":"find","description":"Search for files by glob pattern. Returns matching file paths relative to the search directory. Respects .gitignore. Output is truncated to 1000 results or 50KB (whichever is hit first).","type":"function"},{"strict":false,"parameters":{"properties":{"context":{"description":"Number of lines to show before and after each match (default: 0)","type":"number"},"glob":{"description":"Filter files by glob pattern, e.g. ''*.ts'' or ''**/*.spec.ts''","type":"string"},"ignoreCase":{"description":"Case-insensitive search (default: false)","type":"boolean"},"limit":{"description":"Maximum number of matches to return (default: 100)","type":"number"},"literal":{"description":"Treat pattern as literal string instead of regex (default: false)","type":"boolean"},"path":{"description":"Directory or file to search (default: current directory)","type":"string"},"pattern":{"description":"Search pattern (regex or literal string)","type":"string"}},"required":["pattern"],"type":"object"},"name":"grep","description":"Search file contents for a pattern. Returns matching lines with file paths and line numbers. Respects .gitignore. Output is truncated to 100 matches or 50KB (whichever is hit first). Long lines are truncated to 500 chars.","type":"function"},{"strict":false,"parameters":{"properties":{"job_id":{"description":"Id of the job, such as bash-1 or monitor-1","type":"string"},"reason":{"description":"Why the job is stopped; it appears in the final status","type":"string"}},"required":["job_id"],"type":"object"},"name":"job_kill","description":"Stop a background job and its whole process group. Returns the output of the job and its final status. No notice follows. Use job_list to see the ids.","type":"function"},{"strict":false,"parameters":{"properties":{},"type":"object"},"name":"job_list","description":"List the jobs of this session: running background jobs and monitors, and finished jobs whose end you have not read. One line for each job: id, kind, status, elapsed time and command.","type":"function"},{"strict":false,"parameters":{"properties":{"job_id":{"description":"Id of the job, such as bash-1 or monitor-1","type":"string"},"timeout_ms":{"description":"Longest wait in milliseconds when wait is true (default 30000, maximum 600000)","type":"number"},"wait":{"description":"Block until the job ends or timeout_ms passes","type":"boolean"}},"required":["job_id"],"type":"object"},"name":"job_output","description":"Read the output that a background job wrote since the previous read, and its status. A job that still runs answers at once with the output so far. A notice arrives when a background job finishes, so do not poll job_output while a job runs. Set wait to true only when you have nothing else to do and need the end of the job: the call then blocks until the job ends or timeout_ms passes (default 30000, maximum 600000). Reading the end of a job removes the job and no notice follows.","type":"function"},{"strict":false,"parameters":{"properties":{"limit":{"description":"Maximum number of entries to return (default: 500)","type":"number"},"path":{"description":"Directory to list (default: current directory)","type":"string"}},"type":"object"},"name":"ls","description":"List directory contents. Returns entries sorted alphabetically, with ''/'' suffix for directories. Includes dotfiles. Output is truncated to 500 entries or 50KB (whichever is hit first).","type":"function"},{"strict":false,"parameters":{"properties":{"command":{"description":"Shell command to run; each stdout line is an event","type":"string"},"description":{"description":"Short name of the watch, shown with each event","type":"string"},"persistent":{"description":"Run until job_kill or the end of the session; there is no timeout","type":"boolean"},"timeout_ms":{"description":"Stop the monitor after this many milliseconds (default 36000000, which is 10 h, and also the maximum unless persistent is true)","type":"number"}},"required":["command","description"],"type":"object"},"name":"monitor","description":"Start a background monitor that streams events from a long-running script. Each stdout line is an event; you can keep working and notifications arrive in the chat. Exit ends the watch. Output volume: every stdout line wakes the agent. Print only DONE/FAILED/CANCELLED lines, no progress lines. Use `grep --line-buffered` in pipes (plain `grep` buffers and delays events by minutes). Responsiveness: print FAILED at once when any tracked item fails; never wait for unrelated work to finish. Set persistent: true for session-length watches (PR monitoring, log tails); the monitor then runs until you call job_kill or the session ends. Otherwise it stops at timeout_ms (default 10 h). In a non-interactive run every monitor, a persistent one included, stops after at most 10 minutes; start it again if it is still needed.","type":"function"},{"strict":false,"parameters":{"properties":{"limit":{"description":"Maximum number of lines to read","type":"number"},"offset":{"description":"Line number to start reading from (1-indexed)","type":"number"},"path":{"description":"Path to the file to read (relative or absolute)","type":"string"}},"required":["path"],"type":"object"},"name":"read","description":"Read the contents of a file. Supports text files and images (jpg, png, gif, webp, bmp). Images are sent as attachments. For text files, output is truncated to 2000 lines or 50KB (whichever is hit first). Use offset/limit for large files. When you need the full file, continue with offset until complete.","type":"function"},{"strict":false,"parameters":{"properties":{"content":{"description":"Content to write to the file","type":"string"},"path":{"description":"Path to the file to write (relative or absolute)","type":"string"}},"required":["path","content"],"type":"object"},"name":"write","description":"Write content to a file. Creates the file if it doesn''t exist, overwrites if it does. Automatically creates parent directories.","type":"function"}]}'
