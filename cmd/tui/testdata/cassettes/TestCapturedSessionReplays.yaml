ound for at most `timeout` seconds (default 120, maximum 600). A command that runs longer moves to the background and goes on as a job; it is not stopped. Set run_in_background to true to start a long command, such as a server or a build, in the background at once. A notice arrives when a background job finishes, so do not poll job_output. Stop a job with job_kill. Do not end the command with &. Background jobs end when the session closes. A background job stops after a time limit (by default 2 hours; 10 minutes in a non-interactive run, which waits for its background jobs); with run_in_background, `timeout` sets that limit, up to 2 hours. When a background job prints no output for 5 minutes, a notice says so; the job still runs.","name":"bash","output_schema":null,"parameters":{"properties":{"command":{"description":"Bash command to execute","type":"string"},"run_in_background":{"description":"Start the command as a background job and return at once","type":"boolean"},"timeout":{"description":"Seconds to wait before the command moves to the background (default 120, maximum 600). With run_in_background, the seconds the job may run in the background (default 7200, or 600 in a non-interactive run; maximum 7200)","type":"number"}},"required":["command"],"type":"object"},"strict":false},{"type":"function","description":"Return the given text unchanged.","name":"echo","output_schema":null,"parameters":{"properties":{"text":{"description":"The text to return.","type":"string"}},"required":["text"],"type":"object"},"strict":false},{"type":"function","description":"Edit a single file using exact text replacement. Every edits[].oldText must match a unique, non-overlapping region of the original file. If two changes affect the same block or nearby lines, merge them into one edit instead of emitting overlapping edits. Do not include large unchanged regions just to connect distant changes.","name":"edit","output_schema":null,"parameters":{"properties":{"edits":{"description":"O